<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Charts</title>
</head>
<body>
    <canvas id="myCanvas" width="400" height="400" style="border:1px solid #000000;"></canvas>
    <script type="module">
        import init, { render_pie_chart } from './pkg/wasm_charts.js';
        const data = {
            columns: ["Category", "Value"],
            rows: [
                ["A", 50],
                ["B", 50],
                ["C", 50],
                ["D", 50]
            ]
        };
        await init();
        render_pie_chart('myCanvas', data);
    </script>
</body>
</html>
