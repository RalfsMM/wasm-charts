<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Charts</title>
</head>
<body>
    <canvas id="myCanvas1" width="600" height="450" style="border:1px solid #000000;"></canvas>
    <canvas id="myCanvas2" width="600" height="400" style="border:1px solid #000000;"></canvas>

    <script type="module">
        import init, { render_pie_chart, render_bar_chart } from './pkg/wasm_charts.js';

        const barconfig = {
            label_column: 0,
            value_column: [1, 2, 3],
            vert: true,
            sort_asc: false,
            sort_desc: false,
            sub_color: true,
            sub_stack: true,
            start_x:50.0,
            start_y:50.0,
            height: 300.0,
            width: 400.0, 
            font_size: 10.0,
            font: "10px sans-serif",
            text_color: "black",
            step_fraction: 1.0
        }

        const pieconfig = {
            label_column: 0,
            value_column: [1, 2],
            cx: 200.0,
            cy: 200.0,
            outer_r: 100.0,
            inner_r_diff: 20.0,
            default_font_size: 10.0,
            default_font: "10px sans-serif",
            middle_font_size: 54.0,
            middle_font: "54px sans-serif",
            text_color: "black",
            hover_title_color: "blue"
        }

        const data1 = {
            columns: ["Key", "Value1", "Value2", "Value3"],
            rows: [
                ["Apple", 65, 70, -12],
                ["Banana", 53, 58, 11],
                ["Cherry", 14, 19, -8],
                ["Date", 9, 14, 19],
                ["Elderberry", 6, 10, -2],
                ["Fig", -7, -10, 15],
                ["Grape", 86, 90, -24],
                ["Hamburger", 56, 60, 18],
                ["Icecream", -22, -25, -9],
                ["Jelly", 9, 12, 7],
                ["Kiwi", 89, 95, -30],
                ["Lemon", 30, 35, 12],
                ["Mango", 58, 65, -14],
                ["Nectarine", 23, 28, 6],
                ["Orange", 10, 15, -4],
                ["Papaya", -7, 10, 17],
                ["Quince", 51, 55, -9],
                ["Raspberry", 94, 98, 22],
                ["Strawberry", 2, 5, -3],
                ["Tomato", 1, 3, 8]
            ]
        };

        const data2 = {
            columns: ["Key", "Value1", "Value2", "Value3"],
            rows: [
                ["Apple", 65, 70, 12],
                ["Banana", 53, 58, 11],
                ["Cherry", 14, 19, 8],
                ["Date", 9, 14, 19],
                ["Elderberry", 6, 10, 2],
                ["Fig", 7, 10, 15],
                ["Grape", 86, 90, 24],
                ["Hamburger", 56, 60, 18],
                ["Icecream", 22, 25, 9],
                ["Jelly", 9, 12, 7],
                ["Kiwi", 89, 95, 30],
                ["Lemon", 30, 35, 12],
                ["Mango", 58, 65, 14],
                ["Nectarine", 23, 28, 6],
                ["Orange", 10, 15, 4],
                ["Papaya", 7, 10, 17],
                ["Quince", 51, 55, 9],
                ["Raspberry", 94, 98, 22],
                ["Strawberry", 2, 5, 3],
                ["Tomato", 1, 3, 8]
            ]
        };

        const data3= {
            columns: ["Category", "Value"],
            rows: [
                ["A", 0],
                ["B", 0],
                ["C", 0],
                ["D", 0],
                ["E", 0],
                ["F", 0],
                ["G", 0],
                ["H", 0],
            ]
        };
        const data4 = {
            columns: ["Category", "Value"],
            rows: [
                ["A", 1],
                ["B", 0],
                ["C", 2],
                ["D", 0],
                ["E", 3],
                ["F", 0],
                ["G", 4],
                ["H", 0],
            ]
        };
        const data5 = {
            columns: ["Category", "Value"],
            rows: [
                ["A", 1],
                ["B", -1],
                ["C", 2],
            ]
        };
        await init();
        render_bar_chart('myCanvas1', data1, barconfig)
        render_pie_chart('myCanvas2', data2, pieconfig);
    </script>
</body>
</html>
